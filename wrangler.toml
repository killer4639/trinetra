name = "trinetra"
main = "build/index.js"
compatibility_date = "2026-09-01"

# Runs on every `wrangler deploy` (locally and in Cloudflare Workers Builds).
[build]
command = "sh tools/cloudflare_build.sh"

# Cloudflare serves the frontend straight from static/; only the API reaches the Worker.
[assets]
directory = "./static"
run_worker_first = ["/api/*"]
